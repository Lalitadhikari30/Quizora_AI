# =========================
# Server
# =========================
server.port=${PORT:8081}

# =========================
# Database (Supabase PostgreSQL - Session Pooler)
# =========================
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.gplfxihikpsppsbctjpv
spring.datasource.password=Lalitadhikari
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hikari Pool Stability (VERY IMPORTANT for Supabase free tier)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=30000

# =========================
# Multipart File Upload Configuration
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

# Local upload fallback directory
upload.directory=uploads

# =========================
# Supabase Configuration
# =========================
supabase.url=${SUPABASE_URL:https://gplfxihikpsppsbctjpv.supabase.co}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:${SUPABASE_SERVICE_KEY:your_supabase_service_role_key_here}}
supabase.jwk-url=${SUPABASE_JWK_URL:https://gplfxihikpsppsbctjpv.supabase.co/auth/v1/jwks}
supabase.bucket-name=${SUPABASE_STORAGE_BUCKET:quizora-files}

# =========================
# Gemini AI Configuration
# =========================
gemini.api.key=${GEMINI_API_KEY:${AI_API_KEY:your_gemini_api_key_here}}
gemini.api.url=${GEMINI_API_URL:${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent}}




